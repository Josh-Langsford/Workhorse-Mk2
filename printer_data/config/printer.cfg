[include shell_command.cfg]
# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Z Endstop Switch location            [safe_z_home] section
## Homing end position                  [gcode_macro G32] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## Probe points                         [quad_gantry_level] section
## Min & Max gantry corner postions     [quad_gantry_level] section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_44003A000450335331383820-if00
restart_method: command

[mcu nhk]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_44002C000451353032333039-if00
restart_method: command

[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_38003D00125030514B343620-if00
restart_method: command # Not needed for probes using CAN. 

[mcu rpi]
serial: /tmp/klipper_host_mcu

#[adxl345] - changed by nitehawk
#cs_pin: rpi:None - changed by nitehawk

#[adxl345]	# nitehawk accelerometer
#cs_pin: nhk:PB10
#spi_software_sclk_pin: nhk:PA5
#spi_software_mosi_pin: nhk:PA2
#spi_software_miso_pin: nhk:PA6
#axes_map: -z,-x, y

[adxl345]	# cartographer accelerometer
cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1
axes_map: y, -x, z

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20  # an example

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
#    The folder where the results will be stored. It will be created if it doesn't exist.
number_of_results_to_keep: 3
#    The number of results to keep in the result_folder. The oldest results will
#    be automatically deleted after each runs.
keep_raw_data: False
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for "system" macros that are not in the
#    printer.cfg file. If you want to see the macros in the webui, set this to True.
timeout: 300
#    The maximum time in seconds to let Shake&Tune process the CSV files and generate the graphs.


[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 10000             #Max 4000
max_z_velocity: 30          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 10.0

[input_shaper]
shaper_type_x: ei
shaper_freq_x: 59.6
damping_ratio_x: 0.048
shaper_type_y: ei
shaper_freq_y: 43.0
damping_ratio_y: 0.054

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 64
full_steps_per_rotation:400  #set to 200 for 1.8 degree stepper
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 0
position_max: 355
homing_speed: 32   #Max 100
homing_retract_dist: 0
homing_positive_dir: false

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
diag_pin: ^PG6      # Endstop x pin with pullup (^)
uart_pin: PC4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
# Following is overwritten by TMC Autotune
#stealthchop_threshold: 0
#driver_SGTHRS: 143  # 255 is most sensitive value, 0 is least sensitive

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 64
full_steps_per_rotation:400  #set to 200 for 1.8 degree stepper
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 0
position_max: 360
homing_speed: 32  #Max 100
homing_retract_dist: 0
homing_positive_dir: false

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
diag_pin: ^PG9      # Endstop y pin with pullup (^)
uart_pin: PD11
interpolate: false
run_current: 0.8
sense_resistor: 0.110
# Following is overwritten by TMC Autotune
#stealthchop_threshold: 0
#driver_SGTHRS: 143  # 255 is most sensitive value, 0 is least sensitive 
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
position_max: 300
position_min: -5
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 0

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true   # Changed by TMC Autotune
run_current: 0.8
sense_resistor: 0.110
# Following is overwritten by TMC Autotune
#stealthchop_threshold: 999999

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true   # Changed by TMC Autotune
run_current: 0.8
sense_resistor: 0.110
# Following is overwritten by TMC Autotune
#stealthchop_threshold: 999999

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true   # Changed by TMC Autotune
run_current: 0.8
sense_resistor: 0.110
# Following is overwritten by TMC Autotune
#stealthchop_threshold: 999999

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true   # Changed by TMC Autotune
run_current: 0.8
sense_resistor: 0.110
# Following is overwritten by TMC Autotune
#stealthchop_threshold: 999999


#####################################################################
#   Extruder
#####################################################################

##  Connected to MOTOR_6
##  Heater - HE0
##  Thermistor - T0
[extruder]
#step_pin: PE2 - changed by nitehawk
#dir_pin: PE3 - changed by nitehawk
#enable_pin: !PD4 - changed by nitehawk
step_pin: nhk:PB8
dir_pin: nhk:PB9
enable_pin: !nhk:PC14
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
rotation_distance: 22.8240708   #Bondtech 5mm Drive Gears
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:10 for Stealthburner/Clockwork 2
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
gear_ratio: 50:10               #BMG Gear Ratio
microsteps: 64
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.800
filament_diameter: 1.75
max_extrude_only_distance: 110.0
## Uncomment below for CNC Kitchen max flow test - DO NOT LEAVE UNCOMMENTED
#max_extrude_cross_section: 400
#max_extrude_only_distance: 400

#heater_pin: PA2 - changed by nitehawk
heater_pin: nhk:PA7
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: PT1000
# sensor_pin: PF4 - changed by nitehawk
sensor_pin: nhk:PB12
pullup_resistor: 2200
min_temp: 10
max_temp: 350
max_power: 1.0
min_extrude_temp: 170
#min_extrude_temp: 10
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
##  Try to keep pressure_advance below 1.0
pressure_advance: 0.027
##  Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040

##  E0 on MOTOR6
##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
#uart_pin: PE1 - changed by nitehawk
uart_pin: nhk:PB7
tx_pin: nhk:PB6
interpolate: false
run_current: 0.5
#sense_resistor: 0.110 - changed by nitehawk
sense_resistor: 0.100
# Following is overwritten by TMC Autotune
#stealthchop_threshold: 0


#####################################################################
#  TMC Autotune
#####################################################################
[autotune_tmc stepper_x]
motor: ldo-42sth48-2004mah
tuning_goal: performance
sg4_thrs: 125
toff: 2
pwm_freq_target: 25000
[autotune_tmc stepper_y]
motor: ldo-42sth48-2004mah
tuning_goal: performance
sg4_thrs: 125
toff: 2
pwm_freq_target: 25000

[autotune_tmc stepper_z]
motor: ldo-42sth48-2004ac
tuning_goal: silent
[autotune_tmc stepper_z1]
motor: ldo-42sth48-2004ac
tuning_goal: silent
[autotune_tmc stepper_z2]
motor: ldo-42sth48-2004ac
tuning_goal: silent
[autotune_tmc stepper_z3]
motor: ldo-42sth48-2004ac
tuning_goal: silent

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
tuning_goal: performance


#####################################################################
#   Bed Heater
#####################################################################


##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA1
##  Validate the following thermistor type to make sure it is correct
##  Keenovo branded bed heaters should use Generic 3950
##  LDO branded bed heaters will have the sensor type labelled on the heater
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF3
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 0.7
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#   Additional Sensors
#####################################################################

[temperature_sensor chamber]
## Chamber Temperature - T1
sensor_type: ATC Semitec 104NT-4-R025H42G
#sensor_pin: PF5 - changed by nitehawk
sensor_pin: nhk:PB2
min_temp: 0
max_temp: 100
gcode_id: 'chamber_th'

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor pi_temp]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[thermistor CMFB103F3950FANT]
temperature1: 0.0
resistance1: 32116.0
temperature2: 40.0
resistance2: 5309.0
temperature3: 80.0
resistance3: 1228.0

[temperature_sensor nitehawk_temp]
## Nitehawk PCB Sensor
sensor_type: temperature_mcu
sensor_mcu: nhk    
min_temp: 0
max_temp: 100

[temperature_sensor cartographer_temp]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105


#####################################################################
#   Probe
#####################################################################

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 21.1 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output
travel_speed: 300

#####################################################################
#   Fan Control
#####################################################################

##  Print Cooling Fan - FAN0
[fan]
pin: PG14
max_power: 1.0
kick_start_time: 0.1
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.05
shutdown_speed: 0.0
hardware_pwm: false
cycle_time: 0.005


##  Hotend Fan - FAN1
[heater_fan hotend_fan]
#pin: PE5 - changed by nitehawk
pin: nhk:PD0
tachometer_pin: nhk:PD1 #enable for tachometer
tachometer_ppr: 2 #enable for tachometer
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
shutdown_speed: 1.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0



##  Controller fan - FAN2
[controller_fan electronics_fan]
pin: PD12
kick_start_time: 0.5
stepper: stepper_x, stepper_y, stepper_z, extruder
heater: heater_bed, extruder
max_power: 0.2
shutdown_speed: 0.0

##  Exhaust fan - FAN3
#[heater_fan filter]
#pin: PA2
#max_power: 1.0
#shutdown_speed: 0.0
#kick_start_time: 5.0
#heater: heater_bed
#heater_temp: 40
#fan_speed: 1.0

##  Pi fan - FAN4
#[fan_generic pi_fan]
#pin: PD14
#kick_start_time: 0.5
#max_power: 1.0
#shutdown_speed: 0.0

#####################################################################
#   LED Control
#####################################################################

[output_pin caselight]
## Chamber Lighting - CNC_FAN5
pin: PD15
pwm:true
shutdown_value: 0
value:1
cycle_time: 0.01

[neopixel headlight]
## Stealthburner lighting - RGB_LED
#pin: PB0 - changed by nitehawk
pin: nhk:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 1.0

## PCB Activity Light
[output_pin act_led]
pin: nhk:PC6

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[gcode_arcs]
resolution: 0.1
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.

[idle_timeout]
timeout: 1800

#[safe_z_home]
##  Comment out if using sensorless_homing_override.cfg
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
#home_xy_position:175,175
#speed:300
#z_hop:5
#z_hop_speed:30


##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
##  Probe points
points:
   55, 35
   55, 275
   295, 275
   295, 35
speed: 300
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[bed_mesh]
zero_reference_position: 175, 175 # The centre of your bed.
speed: 150
horizontal_move_z: 5
mesh_min: 25, 25
mesh_max: 325,325
#fade_start: 0.6
#fade_end: 10.0
probe_count: 20,20 # Values should be odd, so one point is directly at bed center
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough

[cartographer scan]
mesh_max_corner_radius: auto
#   Maximum corner radius (mm) for scan mesh path arcs. Omit or set to 'auto' to derive the radius from point spacing and axis limits; 0 disables smoothing arcs; positive values cap the auto-computed radius.

[cartographer touch]
max_samples: 20
#   The maximum number of samples to do before giving up.
sample_range: 0.015
#   Acceptable range (in mm) between touch samples.
#   Constraints: minimum: 0.001, maximum: 0.015

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

#####################################################################
#   Displays
#####################################################################

#[display]
##  mini12864 LCD Display
#lcd_type: uc1701
#cs_pin: EXP1_3
#a0_pin: EXP1_4
